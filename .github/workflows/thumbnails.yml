# Makes small gallery thumbnails and video thumbnails whenever photos or videos are uploaded.
name: Make thumbnails

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "videos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: python tools/make_thumbs.py
      - name: Commit new thumbnails
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets/thumbs videos
            git commit -m "Update thumbnails"
            git push
          fi
