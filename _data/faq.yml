# Questions and answers. These also tell Google to show them in search results.
- q: How much does real estate photography cost in Utah?
  a: Listing photos start at $250, and full listing media with drone aerials and a video tour starts at $400. Price depends on the size of the home and how far we travel. Send us the address for an exact quote.

- q: How fast will I get my photos?
  a: Edited photos are delivered within 24–48 hours of the shoot through a download link. Rush delivery is available if you need the listing live sooner.

- q: Do you offer drone photography?
  a: Yes. Every aerial shoot is flown by an FAA Part 107 licensed pilot through our sister company, 801 Aerial, so it's legal and insured for commercial work.

- q: What areas of Utah do you serve?
  a: We're based in Pleasant Grove and shoot across Utah County, Salt Lake County, Davis County, Weber County, Park City, and Heber. We travel anywhere in Utah for a small travel fee.

- q: How should I prepare the home for the shoot?
  a: Turn on every light, open blinds, clear counters, hide personal items and trash cans, and move cars out of the driveway. We'll send you a full prep checklist when you book.

- q: What does social media management include?
  a: We plan, edit, caption, and post your content every week, reply to comments, and hold a monthly content day for posts beyond listings, like behind-the-scenes, testimonials, and finished projects.

- q: Do you work with home builders?
  a: Yes. We photograph new construction, model homes, and Parade of Homes entries, and we offer monthly packages for builders with several projects a month.

- q: Can I use the photos anywhere?
  a: Yes. You can use your photos and videos to market the listing on the MLS, Zillow, your website, social media, and print.
